events {}

http {
    resolver 127.0.0.11 valid=10s;

    server {
        listen 8000;

        location /api/login {
            set $ventas http://ventas-service:8000;
            proxy_pass $ventas;
        }
        location /api/ventas {
            set $ventas http://ventas-service:8000;
            proxy_pass $ventas;
        }
        location /api/reportes {
            set $ventas http://ventas-service:8000;
            proxy_pass $ventas;
        }
        location /api/productos {
            set $inventario http://inventario-service:8000;
            proxy_pass $inventario;
        }
        location /api/inventario {
            set $inventario http://inventario-service:8000;
            proxy_pass $inventario;
        }
        location /api/notificaciones {
            set $notificaciones http://notificaciones-service:8000;
            proxy_pass $notificaciones;
        }
        location /api/compras {
            set $compras http://compras-service:8000;
            proxy_pass $compras;
        }
    }
}